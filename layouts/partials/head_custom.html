<link rel="stylesheet" href="{{ "css/custom.css" | relURL }}">
{{ if and (eq .Kind "page") (or (eq .Section "post") (eq .Section "engineering-note")) }}
  <link rel="stylesheet" href="{{ "css/mini-toc.css" | relURL }}">
{{ end }}
<link rel="stylesheet" href="{{ "css/yahoo.css" | relURL }}">

<!-- RSS Feed Auto-Discovery -->
<link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }} - RSS Feed" href="{{ .Site.BaseURL }}index.xml" />
{{ if eq .Section "post" }}
<link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }} - Posts RSS Feed" href="{{ .Site.BaseURL }}post/index.xml" />
{{ end }}
{{ if eq .Section "engineering-note" }}
<link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }} - Engineering Notes RSS Feed" href="{{ .Site.BaseURL }}engineering-note/index.xml" />
{{ end }}
