{{ partial "header.html" . }}
<div class="article-meta">
  <h1><span class="title">{{ .Title | markdownify }}</span></h1>
  {{ with .Params.author }}<h2 class="author">{{ . }}</h2>{{ end }}
</div>

<main>
  <article>
    {{ .Content }}
  </article>
  <nav id="mini-toc" aria-label="Table of contents">
    <!-- filled by JS -->
  </nav>
  <script>
    (function () {
      const toc = document.getElementById('mini-toc');
      if (!toc) return;

      // Collect all h2 (and optionally h3) headings in the article
      const headings = Array.from(
        document.querySelectorAll('article h2, article h3')
      );

      if (headings.length === 0) return;

      // Build links
      headings.forEach((h) => {
        // Make sure each heading has an id
        if (!h.id) {
          h.id = h.textContent.trim()
            .toLowerCase()
            .replace(/[^\w\s-]/g, '')
            .replace(/\s+/g, '-');
        }

        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        // Indent h3 entries
        if (h.tagName === 'H3') a.style.paddingLeft = '1rem';
        toc.appendChild(a);
      });

      // Highlight active section on scroll
      const links = Array.from(toc.querySelectorAll('a'));

      function onScroll() {
        let current = headings[0];
        for (const h of headings) {
          if (h.getBoundingClientRect().top <= 120) {
            current = h;
          }
        }
        links.forEach((a) => {
          a.classList.toggle('active', a.getAttribute('href') === '#' + current.id);
        });
      }

      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll(); // run once on load
    })();
  </script>
</main>

<div class="comment">
  <script src="https://utteranc.es/client.js" repo="rohmanhakim/rohmanhakim.github.io" issue-term="pathname"
    theme="github-light" crossorigin="anonymous" async>
    </script>
</div>
